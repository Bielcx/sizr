<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Troque titulo e descricao pelos da sua empresa. -->
    <title>Sizr — configurador 3D sob medida com pedido no WhatsApp</title>
    <meta name="description" content="Configurador 3D pronto para gráficas e embalagens: o cliente ajusta as medidas e manda o pedido no seu WhatsApp. Pagamento único, sem mensalidade." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Cartao de compartilhamento. O produto se distribui por WhatsApp, e
      link sem imagem la parece spam.

      IMPORTANTE: og:url e og:image precisam ser o endereco absoluto e real
      do site. Os raspadores do WhatsApp e do Facebook nao resolvem caminho
      relativo e nao renderizam SVG. Troque o dominio abaixo ao publicar.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Sizr" />
    <meta property="og:url" content="https://sizr.app/" />
    <meta property="og:title" content="Configurador 3D no seu site em um minuto. De graça." />
    <meta
      property="og:description"
      content="Seu cliente escolhe as medidas, vê a peça em 3D e manda o pedido pronto no seu WhatsApp. Sem cadastro, sem backend."
    />
    <meta property="og:image" content="https://sizr.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sizr — configurador 3D sob medida com pedido no WhatsApp" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
